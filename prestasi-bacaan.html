<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

  :root {
    --bg-dark: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --accent: #38bdf8;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
    --glass: 1px solid rgba(255, 255, 255, 0.1);
  }

  #tilawah-dashboard {
    font-family: 'Plus Jakarta Sans', sans-serif;
    max-width: 900px;
    margin: 28px auto;
    padding: 30px;
    background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
    border-radius: 24px;
    border: var(--glass);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    color: var(--text-main);
  }

  /* ── BULAN TABS ── */
  #tilawah-dashboard .bulan-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 25px; scrollbar-width: none; }
  #tilawah-dashboard .tab-btn {
    padding: 10px 20px;
    background: rgba(255,255,255,0.05);
    border: var(--glass);
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-dim);
    transition: 0.3s;
  }
  #tilawah-dashboard .tab-btn.active { background: var(--accent); color: #000; border: none; }

  /* ── HEADER PANEL ── */
  #tilawah-dashboard .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  #tilawah-dashboard .header-panel h2 { font-size: 1.4em; margin: 0; letter-spacing: -0.5px; }
  #tilawah-dashboard .label-bulan { color: var(--accent); font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  
  #tilawah-dashboard select {
    padding: 10px 16px;
    border-radius: 10px;
    border: var(--glass);
    background: rgba(0,0,0,0.2);
    color: var(--text-main);
    font-weight: 600;
    cursor: pointer;
  }

  /* ── STAT CARDS ── */
  #tilawah-dashboard .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 30px; }
  #tilawah-dashboard .stat-card {
    padding: 20px;
    border-radius: 18px;
    text-align: center;
    background: var(--card-bg);
    border: var(--glass);
  }
  #tilawah-dashboard .stat-card .stat-val { display: block; font-size: 32px; font-weight: 800; color: var(--accent); margin-top: 5px; }

  /* ── KATEGORI ── */
  #tilawah-dashboard .kat-section { background: var(--card-bg); padding: 25px; border-radius: 18px; border: var(--glass); }
  #tilawah-dashboard .kat-title { font-size: 0.8em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
  #tilawah-dashboard .kat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  #tilawah-dashboard .kat-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center; }
  #tilawah-dashboard .kat-val { font-size: 20px; font-weight: 800; color: var(--text-main); }

  /* ── UTILS ── */
  #tilawah-dashboard .loader { text-align: center; padding: 40px; color: var(--text-dim); }
  #tilawah-dashboard .hidden { display: none !important; }
  @media (max-width: 480px) { #tilawah-dashboard .header-panel { flex-direction: column; gap: 15px; } }
</style>

<div id="tilawah-dashboard">
  <div id="td-bulanList" class="bulan-tabs"></div>
  <div class="header-panel">
    <div>
      <h2>📖 PRESTASI TILAWAH</h2>
      <div id="td-labelBulan" class="label-bulan">Memuatkan...</div>
    </div>
    <select id="td-pilihTarikh" onchange="tdTukarTarikh()"><option>— Pilih Tarikh —</option></select>
  </div>

  <div id="td-loader" class="loader">Memproses data...</div>

  <div id="td-mainContent" class="hidden">
    <div class="stats-grid">
      <div class="stat-card">LANCAR<span id="td-v-lancar" class="stat-val">0</span></div>
      <div class="stat-card">KURANG<span id="td-v-kurang" class="stat-val">0</span></div>
      <div class="stat-card">TIDAK L.<span id="td-v-tidak-l" class="stat-val">0</span></div>
      <div class="stat-card">TIDAK H.<span id="td-v-tidak-h" class="stat-val">0</span></div>
    </div>
    <div class="kat-section">
      <div class="kat-title">JUMLAH MENGIKUT KATEGORI</div>
      <div id="td-katBox" class="kat-grid"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzeh6FFkAnvMcpGylgP8yuNUiIB4GKCs9RLOUwPDNFkJqwbFq1NjeXbDZnFm9pZpgNKTA/exec";
  let bulanAktif = "";

  function tdInit() {
    fetch(WEB_APP_URL + "?action=getBulan")
      .then(r => r.json())
      .then(data => {
        if (data.error) return;
        var box = document.getElementById("td-bulanList");
        data.bulan.forEach((b, i) => {
          var btn = document.createElement("button");
          btn.className = "tab-btn" + (i === 0 ? " active" : "");
          btn.textContent = b;
          btn.onclick = () => tdTukarBulan(btn, b);
          box.appendChild(btn);
        });
        if (data.bulan.length > 0) tdMuatData(data.bulan[0]);
      });
  }

  function tdMuatData(bulan, tarikh) {
    bulanAktif = bulan;
    document.getElementById("td-loader").classList.remove("hidden");
    document.getElementById("td-mainContent").classList.add("hidden");
    document.getElementById("td-labelBulan").textContent = "BULAN: " + bulan;
    fetch(WEB_APP_URL + "?bulan=" + encodeURIComponent(bulan) + "&tarikh=" + encodeURIComponent(tarikh || ""))
      .then(r => r.json())
      .then(data => {
        var dd = document.getElementById("td-pilihTarikh");
        dd.innerHTML = "";
        data.senaraiTarikh.forEach(t => {
          var opt = document.createElement("option");
          opt.value = t; opt.textContent = t;
          if (t === data.tarikhAktif) opt.selected = true;
          dd.appendChild(opt);
        });
        document.getElementById("td-v-lancar").textContent = data.prestasi.lancar;
        document.getElementById("td-v-kurang").textContent = data.prestasi.kurangLancar;
        document.getElementById("td-v-tidak-l").textContent = data.prestasi.tidakLancar;
        document.getElementById("td-v-tidak-h").textContent = data.prestasi.tidakHadir;
        var katBox = document.getElementById("td-katBox");
        katBox.innerHTML = "";
        Object.keys(data.kategori).sort().forEach(key => {
          var card = document.createElement("div");
          card.className = "kat-card";
          card.innerHTML = '<div style="font-size:10px; color:var(--text-dim)">' + key + '</div><div class="kat-val">' + data.kategori[key] + '</div>';
          katBox.appendChild(card);
        });
        document.getElementById("td-loader").classList.add("hidden");
        document.getElementById("td-mainContent").classList.remove("hidden");
      });
  }

  function tdTukarBulan(btn, bulan) {
    document.querySelectorAll("#tilawah-dashboard .tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    tdMuatData(bulan);
  }

  window.tdTukarTarikh = () => tdMuatData(bulanAktif, document.getElementById("td-pilihTarikh").value);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tdInit); else tdInit();
})();
</script>
