<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  .rph-container { font-family: 'Plus Jakarta Sans', sans-serif; max-width: 900px; margin: 20px auto; padding: 25px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #eee; }
  .form-group { margin-bottom: 20px; }
  label { font-weight: 700; display: block; margin-bottom: 8px; font-size: 14px; color: #374151; }
  select, input, textarea { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 10px; box-sizing: border-box; font-size: 15px; }
  
  .kemahiran-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
    gap: 12px; 
    background: #f9fafb; 
    padding: 20px; 
    border-radius: 12px; 
    border: 1px solid #e5e7eb; 
  }
  .check-item { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    cursor: pointer; 
    padding: 10px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid #f3f4f6;
    transition: 0.2s;
    font-size: 15px;
  }
  .check-item:hover { border-color: #0052ff; background: #eff6ff; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; margin: 0; }

  .btn-submit { background: #0052ff; color: white; padding: 18px; border: none; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
  .rph-card { background: #fff; border-radius: 15px; padding: 20px; border-left: 6px solid #0052ff; position: relative; border: 1px solid #eee; margin-bottom: 20px; transition: 0.3s; }
  .rph-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .hidden { display: none; }
  .card-tag { font-size: 11px; background: #0052ff; color: white; padding: 3px 10px; border-radius: 5px; }
  
  .card-actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-lihat { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; flex: 1; min-width: 60px; }
  .btn-edit-card { background: #f59e0b; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; flex: 1; min-width: 60px; }
  .btn-padam { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; flex: 1; min-width: 60px; }
  .btn-copy-mini { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; margin-left: 5px; }
  .btn-copy-mini:hover { background: #e5e7eb; }

  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
  .modal-content { background: white; margin: 5% auto; padding: 25px; width: 80%; max-width: 600px; border-radius: 20px; max-height: 80vh; overflow-y: auto; }
  .modal-header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  .close-modal { cursor: pointer; font-size: 24px; font-weight: bold; color: #666; }
  .info-row { margin-bottom: 12px; border-bottom: 1px solid #f3f4f6; padding-bottom: 8px; position: relative; }
  .info-label { font-weight: bold; color: #0052ff; font-size: 12px; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
  .info-val { font-size: 15px; color: #1f2937; margin-top: 3px; line-height: 1.4; padding-right: 10px; }

  /* ── Butang Kad Data eRPH ── */
  .nav-bar {
    max-width: 900px;
    margin: 20px auto 0 auto;
    padding: 0 25px;
    display: flex;
    justify-content: flex-end;
  }
  .btn-kad-erph {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #0052ff 0%, #0a3db5 100%);
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 14px;

  .btn-kad-erph:active {

  }
  .btn-kad-erph .icon-wrap {
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,0.18);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn-kad-erph .icon-wrap svg {

  }
  .btn-kad-erph .label-wrap {
    display: flex;
    flex-direction: column;

  }
  .btn-kad-erph .label-main {

  }
  .btn-kad-erph .label-sub {

  /* ── Ruang Catatan Tambahan (Premium Accent) ── */
  .box-tambahan {

    padding: 14px 14px 14px 16px;

    border-left: 3px solid #0052ff;

  }
  .box-tambahan-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #0052ff;
    margin-bottom: 8px;
  }
  .box-tambahan-label .spark {
    font-size: 12px;
    filter: drop-shadow(0 1px 1px rgba(0,82,255,0.3));
  }
  .box-tambahan textarea {
    border: 1.5px solid #e5edff;
    background: #ffffff;
    font-size: 14px;
  }
  .box-tambahan textarea:focus {
    outline: none;
    border-color: #0052ff;
    box-shadow: 0 0 0 3px rgba(0,82,255,0.12);
  }

  /* ── Mobile Responsive ── */
  @media (max-width: 600px) {
    .rph-container { margin: 10px; padding: 16px; border-radius: 14px; }
    .nav-bar { padding: 0 10px; margin: 10px auto 0; }

        <option value="موريد ممباچ دان ݢورو مندڠر سرتا بتولکن يڠ ساله">موريد ممباچ دان ݢورو مندڠر سرتا بتولکن يڠ ساله</option>

<script>
  let senaraiData = [];
  let modeRefleksi = 'madah';

  function autoJumlah() {
    const l = parseInt(document.getElementById('hadir_l').value) || 0;
    const p = parseInt(document.getElementById('hadir_p').value) || 0;
    const jumlah = l + p;
    const totalField = document.getElementById('hadir_total').value;
    const bahagian = totalField.split('/');
    const maxMurid = bahagian[1] ? bahagian[1].trim() : '35';
    document.getElementById('hadir_total').value = jumlah + '/' + maxMurid;
  }

  function updateSKManual() {
    const sel = document.getElementById('sk_select');
    if(sel.value !== "" && sel.value !== "lain") {
        document.getElementById('sk').value = sel.value;
    } else if(sel.value === "lain") {
        document.getElementById('sk').value = "";
        document.getElementById('sk').focus();
    }
  }

  function updateSPManual() {
    const sel = document.getElementById('sp_select');
    if(sel.value !== "") {
        document.getElementById('sp').value = sel.value;
    }
  }

  function toJawiNumber(num) {
    const jawiDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    return num.toString().split('').map(d => jawiDigits[parseInt(d)]).join('');
  }

  function renumberAktiviti() {
    const textarea = document.getElementById('aktiviti');
    const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l !== '');
    const renumbered = lines.map((line, idx) => {
        const bersih = line.replace(/^[٠-٩0-9]+[.\)]\s*/, '');
        return `${toJawiNumber(idx + 1)}. ${bersih}`;
    });
    textarea.value = renumbered.join('\n');
  }

  function updateAktivitiManual() {
    const sel = document.getElementById('aktiviti_select');
    if(sel.value !== "") {
        const textarea = document.getElementById('aktiviti');
        const existing = textarea.value.trim();
        textarea.value = existing ? `${existing}\n${sel.value}` : sel.value;
        sel.value = "";
        renumberAktiviti();
    }
  }

  function pilihRefleksi(mode) {
      modeRefleksi = mode;
      const bMadah = document.getElementById('btnMadah');
      const bTilawah = document.getElementById('btnTilawah');
      const boxMadah = document.getElementById('box-ref-madah');
      const boxTilawah = document.getElementById('box-ref-tilawah');

      if(mode === 'madah') {
          boxMadah.classList.remove('hidden'); boxTilawah.classList.add('hidden');
          bMadah.style.background = "#ef4444"; bMadah.style.color = "white"; bMadah.style.borderColor = "#ef4444";
          bTilawah.style.background = "#fff"; bTilawah.style.color = "#374151"; bTilawah.style.borderColor = "#ddd";
      } else {
          boxMadah.classList.add('hidden'); boxTilawah.classList.remove('hidden');
          bTilawah.style.background = "#ef4444"; bTilawah.style.color = "white"; bTilawah.style.borderColor = "#ef4444";
          bMadah.style.background = "#fff"; bMadah.style.color = "#374151"; bMadah.style.borderColor = "#ddd";
      }
  }

  function muatRekod() {
    const box = document.getElementById('kadBox');
    box.innerHTML = "<p style='text-align:center; color:#666;'>Memuatkan rekod...</p>";
    fetch(scriptURL).then(res => res.json()).then(data => {
      senaraiData = data;
      box.innerHTML = "";
      data.reverse().forEach(item => {
        box.innerHTML += `
          <div class="rph-card" id="card-${item.row}">
            <div style="display:flex; justify-content:space-between; align-items:start;">
               <span class="card-tag">${item.hari} | ${item.tarikh} | M${item.minggu}</span>
               <button class="btn-copy-mini" onclick="salinSemua('${item.row}')">COPY ALL</button>
            </div>
            <div style="font-weight:800; margin-top:10px;">${item.subjek} (${item.kelas})</div>
            <div style="color:#0052ff; font-weight:bold; font-size:12px; margin-top:5px; line-height:1.4;">${item.refleksi}</div>
            <div class="card-actions">
                <button class="btn-lihat" onclick="lihatData('${item.row}')">LIHAT</button>
                <button class="btn-edit-card" onclick="isiBorangEdit('${item.row}')">EDIT</button>
                <button class="btn-padam" onclick="padamRekod('${item.row}')">PADAM</button>
            </div>
          </div>`;
      });
    });
  }

  function lihatData(rowNum) {
    const item = senaraiData.find(x => x.row == rowNum);
    if(!item) return;
    const masa = (item.hari === 'Khamis') ? item.masaK : item.masaAI;
    const body = document.getElementById('modalBody');
    
    const createRow = (label, val) => {
        if(!val) val = "-";
        const cleanVal = val.toString().replace(/<br>/g, '\n');
        return `
        <div class="info-row">
            <div class="info-label">
                ${label}
                <button class="btn-copy-mini" onclick="salinTeks(this, \`${cleanVal.replace(/`/g, '\\`').replace(/\${/g, '\\${')}\`)">COPY</button>
            </div>
            <div class="info-val" style="white-space: pre-wrap;">${val}</div>
        </div>`;
    };

    body.innerHTML = `
      ${createRow("Tarikh / Hari / Minggu", `${item.tarikh} | ${item.hari} (M${item.minggu})`)}
      ${createRow("Subjek / Kelas", `${item.subjek} - ${item.kelas}`)}
      ${createRow("Masa", masa)}
      ${createRow("Kehadiran", item.kehadiran || "-")}
      ${createRow("Standard Kandungan", item.sk)}
      ${createRow("Kemahiran", item.kemahiran)}
      ${createRow("Standard Pembelajaran", item.sp)}
      ${createRow("Aktiviti", item.aktiviti)}
      ${createRow("Refleksi", item.refleksi)}
    `;
    document.getElementById('myModal').style.display = "block";
  }

  function salinTeks(btn, teks) {
    navigator.clipboard.writeText(teks).then(() => {
        const asal = btn.innerText;
        btn.innerText = "COPIED!";
        btn.style.background = "#10b981";
        btn.style.color = "white";
        setTimeout(() => {
            btn.innerText = asal;
            btn.style.background = "";
            btn.style.color = "";
        }, 1500);
    });
  }
  
  function salinSemua(rowNum) {
    const item = senaraiData.find(x => x.row == rowNum);
    const masa = (item.hari === 'Khamis') ? item.masaK : item.masaAI;
    const teks = `TARIKH: ${item.tarikh} (${item.hari})\nMINGGU: ${item.minggu}\nSUBJEK: ${item.subjek} (${item.kelas})\nMASA: ${masa}\nKEHADIRAN: ${item.kehadiran || "-"}\nSK: ${item.sk}\nSP: ${item.sp}\nKEMAHIRAN: ${item.kemahiran}\nAKTIVITI: ${item.aktiviti}\nREFLEKSI: ${item.refleksi.replace(/<br>/g, '')}`;
    navigator.clipboard.writeText(teks).then(() => alert("Semua maklumat disalin!"));
  }

  function padamRekod(rowNum) {
    if(confirm("Adakah anda pasti mahu memadam rekod ini?")) {
        const btn = event.target;
        btn.innerText = "...";
        btn.disabled = true;
        fetch(scriptURL + "?action=deleteRPH&row=" + rowNum, { method: 'POST' })
        .then(() => {
            alert("Rekod berjaya dipadam!");
            muatRekod();
        })
        .catch(() => {
            alert("Ralat memadam!");
            btn.innerText = "PADAM";
            btn.disabled = false;
        });
    }
  }

  function tutupModal() { document.getElementById('myModal').style.display = "none"; }

  function getSelectedKemahiran() {
    const cb = document.querySelectorAll('input[name="kemahiran"]:checked');
    let v = []; cb.forEach(c => v.push(c.value));
    let hasil = v.join(', ');
    const tambahan = document.getElementById('kemahiran_lain').value.trim();
    if(tambahan) {
        hasil = hasil ? `${hasil} | Lain-lain: ${tambahan}` : `Lain-lain: ${tambahan}`;
    }
    return hasil;
  }

  function hantarRPH() {
    const btn = document.getElementById('btnHantar');
    btn.innerText = "PROSES..."; btn.disabled = true;
    
    const row = document.getElementById('editRow').value;
    const action = row ? "updateRPH" : "simpanRPH";
    const hari = document.getElementById('hari').value;
    const tarikh = document.getElementById('tarikh').value;
    
    const hl = document.getElementById('hadir_l').value || '0';
    const hp = document.getElementById('hadir_p').value || '0';
    const htotal = document.getElementById('hadir_total').value;
    const kehadiranPenuh = `Lelaki: ${hl} | Perempuan: ${hp} | Jumlah: ${htotal}`;

    let refPenuh = "";
    if(modeRefleksi === 'madah') {
        const r1 = document.getElementById('ref1').value;
        const r2 = document.getElementById('ref2').value;
        refPenuh = `${r1} موريد مڠواساءي | ${r2} ممرلوكن بيمبيڠن`;
    } else {
        const rl = document.getElementById('ref_lancar_val').value;
        const rk = document.getElementById('ref_kurang_val').value;
        const rt = document.getElementById('ref_tidak_val').value;
        refPenuh = `${rl} لنچر | ${rk} کورڠ لنچر | ${rt} تيدق لنچر`;
    }
    
    let aktFinal = document.getElementById('aktiviti').value;
    const aktTambahan = document.getElementById('aktiviti_tambahan').value.trim();
    if(aktTambahan) {
        aktFinal = aktFinal ? `${aktFinal}\n\n[Tambahan]: ${aktTambahan}` : `[Tambahan]: ${aktTambahan}`;
    }

    const kemahiranFinal = getSelectedKemahiran();

    const p = `action=${action}&row=${row}&hari=${hari}&tarikh=${tarikh}&minggu=${v('minggu')}&subjek=${v('subjek')}&kelas=${v('kelas')}&masaAI=${v('masaAI')}&masaK=${v('masaK')}&kehadiran=${encodeURIComponent(kehadiranPenuh)}&sk=${v('sk')}&kemahiran=${encodeURIComponent(kemahiranFinal)}&sp=${v('sp')}&aktiviti=${encodeURIComponent(aktFinal)}&refleksi=${encodeURIComponent(refPenuh)}`;
    
    fetch(scriptURL + "?" + p, { method: 'POST' }).then(() => { 
        alert("Berjaya!"); 
        btn.innerText = "SIMPAN REKOD"; btn.disabled = false;
        batalEdit(); muatRekod(); 
    });
  }

  function isiBorangEdit(rowNum) {
    const item = senaraiData.find(x => x.row == rowNum);
    if(!item) return;
    document.getElementById('editRow').value = rowNum;
    document.getElementById('hari').value = item.hari;
    document.getElementById('tarikh').value = item.tarikh;
    document.getElementById('minggu').value = item.minggu;
    document.getElementById('subjek').value = item.subjek;
    document.getElementById('kelas').value = item.kelas;
    document.getElementById('sk').value = item.sk;
    document.getElementById('sk_select').value = "";
    document.getElementById('sp').value = item.sp;

    let aktivitiStr = item.aktiviti || "";
    let aktivitiTambahan = "";
    if(aktivitiStr.includes('[Tambahan]:')) {
        const aparts = aktivitiStr.split('[Tambahan]:');
        aktivitiStr = aparts[0].replace(/\n\n$/, '').trim();
        aktivitiTambahan = aparts[1] ? aparts[1].trim() : "";
    }
    document.getElementById('aktiviti').value = aktivitiStr;
    renumberAktiviti();
    document.getElementById('aktiviti_tambahan').value = aktivitiTambahan;
    document.getElementById('aktiviti_select').value = "";

    if(item.refleksi.includes('لنچر')) {
        pilihRefleksi('tilawah');
    } else {
        pilihRefleksi('madah');
    }

    let kemahiranStr = item.kemahiran || "";
    let kemahiranTambahan = "";
    if(kemahiranStr.includes('Lain-lain:')) {
        const kparts = kemahiranStr.split('Lain-lain:');
        kemahiranStr = kparts[0].replace(/\|\s*$/, '').trim();
        kemahiranTambahan = kparts[1] ? kparts[1].trim() : "";
    }
    document.querySelectorAll('input[name="kemahiran"]').forEach(cb => { 
        cb.checked = kemahiranStr.includes(cb.value); 
    });
    document.getElementById('kemahiran_lain').value = kemahiranTambahan;

    toggleMasa();
    if(item.hari === 'Khamis') document.getElementById('masaK').value = item.masaK;
    else document.getElementById('masaAI').value = item.masaAI;
    document.getElementById('formTitle').innerText = "KEMASKINI REKOD";
    document.getElementById('btnBatal').classList.remove('hidden');
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function batalEdit() {
    document.getElementById('editRow').value = "";
    document.getElementById('formTitle').innerText = "Mini e-RPH";
    document.getElementById('btnBatal').classList.add('hidden');
    document.getElementById('sk').value = "";
    document.getElementById('sk_select').value = "";
    document.getElementById('sp').value = "";
    document.getElementById('sp_select').value = "";
    document.getElementById('tarikh').value = "";
    document.getElementById('aktiviti').value = "";
    document.getElementById('aktiviti_select').value = "";
    document.getElementById('aktiviti_tambahan').value = "";
    document.getElementById('kemahiran_lain').value = "";
    document.getElementById('hadir_l').value = "0";
    document.getElementById('hadir_p').value = "0";
    document.getElementById('hadir_total').value = "0/35";
    document.querySelectorAll('input[name="kemahiran"]').forEach(cb => cb.checked = false);
  }

  function v(id) { return encodeURIComponent(document.getElementById(id).value); }
  function toggleMasa() {
    const h = document.getElementById('hari').value;
    document.getElementById('box-masa-ai').classList.toggle('hidden', h === 'Khamis');
    document.getElementById('box-masa-k').classList.toggle('hidden', h !== 'Khamis');
  }
  window.onload = muatRekod;
</script>
