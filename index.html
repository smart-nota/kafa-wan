<script>
(function() {
    const titleText = "\u0627\u0644\u0633\u0644\u0627\u0645 \u0639\u0644\u064a\u0643\u0645 \u064a\u0627 \u0648\u0627\u0646 \u0627\u0644\u0648\u0633\u064a\u0645";
    const subtitleText = "\u0643\u064a\u0641 \u062d\u0627\u0644\u0643 \u0627\u0644\u064a\u0648\u0645\u061f \u0623\u062a\u0645\u0646\u0649 \u0623\u0646 \u062a\u0643\u0648\u0646 \u062f\u0627\u0626\u0645\u0627\u064b \u0641\u064a \u062e\u064a\u0631";

    function startTyping(elId, text, speed, nextFn) {
        const el = document.getElementById(elId);
        let i = 0;
        const chars = Array.from(text);
        function step() {
            if (i < chars.length) {
                el.innerText += chars[i];
                i++;
                setTimeout(step, speed);
            } else if(nextFn) {
                setTimeout(nextFn, 600);
            }
        }
        step();
    }
    setTimeout(() => {
        startTyping("type-title", titleText, 100, () => {
            startTyping("type-subtitle", subtitleText, 50);
        });
    }, 500);
})();

/* --- Addition: copy-to-clipboard for My RPH credentials --- */
(function() {
    document.querySelectorAll('.copy-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const value = btn.getAttribute('data-copy');
            const originalText = btn.textContent;

            function showCopied() {
                btn.textContent = 'Disalin!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 1500);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(value).then(showCopied).catch(function() {
                    fallbackCopy(value);
                    showCopied();
                });
            } else {
                fallbackCopy(value);
                showCopied();
            }

            function fallbackCopy(text) {
                const temp = document.createElement('textarea');
                temp.value = text;
                temp.style.position = 'fixed';
                temp.style.opacity = '0';
                document.body.appendChild(temp);
                temp.focus();
                temp.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(temp);
            }
        });
    });
})();
</script>
